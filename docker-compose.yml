# Stack completo de desarrollo local · web Django + DB Postgres + Redis (cache + Celery broker)
# El backend vive en ./server (Dockerfile, código, requirements). Este compose
# orquesta TODO el stack, por eso vive en la raíz del repo.
#
# Uso:
#   docker compose up -d           # background
#   docker compose logs -f web
#   docker compose exec web python manage.py migrate
#
# Los secretos del backend (SECRET_KEY, GOOGLE_*, EMAIL_*) se inyectan desde
# ./server/.env vía `env_file`. Las variables de infraestructura (DB/Redis del
# stack, DEBUG, ALLOWED_HOSTS) se fijan aquí y sobreescriben a las del .env.

name: certifai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       certifai
      POSTGRES_USER:     certifai
      POSTGRES_PASSWORD: certifai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U certifai -d certifai"]
      interval: 5s
      timeout:  5s
      retries:  10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  10

  web:
    build: ./server
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    env_file:
      - ./server/.env
    environment:
      DEBUG:                 "False"
      SECURE_SSL_REDIRECT:   "False"
      ALLOWED_HOSTS:         "localhost,127.0.0.1,web,0.0.0.0,192.168.0.106"
      DATABASE_URL:          postgres://certifai:certifai@db:5432/certifai
      CELERY_BROKER_URL:     redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./server/media:/app/media
      - ./server/staticfiles:/app/staticfiles
    ports:
      - "8500:8000"
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./server
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=2
    env_file:
      - ./server/.env
    environment:
      DEBUG:                 "False"
      DATABASE_URL:          postgres://certifai:certifai@db:5432/certifai
      CELERY_BROKER_URL:     redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./server/media:/app/media
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }

  beat:
    build: ./server
    restart: unless-stopped
    command: celery -A config beat -l info --schedule=/tmp/celerybeat-schedule
    env_file:
      - ./server/.env
    environment:
      DEBUG:                 "False"
      DATABASE_URL:          postgres://certifai:certifai@db:5432/certifai
      CELERY_BROKER_URL:     redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
