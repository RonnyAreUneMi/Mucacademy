<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CertifAI · Perfil</title>
<style>
  :root{
    --brand:#F58830; --brand-dark:#D97520; --navy:#162054;
    --bg:#0A1535; --card:#152448; --card-soft:#1A2A52; --border:rgba(255,255,255,.10);
    --text:#FFFFFF; --muted:#94A3B8; --soft:rgba(255,255,255,.04);
    --success:#10B981; --violet:#7C3AED; --violet-light:#A855F7; --info:#3B82F6;
    --danger:#EF4444;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{
    background:#0a0f24;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex;flex-wrap:wrap;gap:48px;justify-content:center;
    padding:48px;color:var(--text);
  }
  /* Phone frame */
  .phone{
    width:390px;height:844px;border-radius:48px;
    background:var(--bg);overflow:hidden;position:relative;
    box-shadow:0 40px 100px -20px rgba(0,0,0,.6),0 0 0 12px #05091a,0 0 0 13px rgba(255,255,255,.05);
  }
  .aurora{position:absolute;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(420px 300px at 50% -4%,rgba(245,136,48,.20),transparent 60%),
      radial-gradient(380px 320px at 100% 30%,rgba(124,58,237,.14),transparent 60%),
      radial-gradient(500px 360px at 50% 95%,rgba(22,32,84,.55),transparent 70%);}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:140px;height:30px;background:#05091a;border-radius:0 0 18px 18px;z-index:50}
  .statusbar{display:flex;justify-content:space-between;align-items:center;
    padding:14px 28px 2px;font-size:13px;font-weight:700;position:relative;z-index:5}
  .screen{height:100%;overflow-y:auto;padding-bottom:24px;position:relative;z-index:2}
  .screen::-webkit-scrollbar{display:none}
  .label{position:absolute;bottom:-34px;left:0;right:0;text-align:center;
    font-size:13px;font-weight:800;color:#64748B;letter-spacing:1px;text-transform:uppercase}

  .pad{padding:0 24px}

  /* ── Screen header ── */
  .shead{padding-top:8px;margin-bottom:6px}
  .shead .eyebrow{font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--brand)}
  .shead .title{font-size:30px;font-weight:900;letter-spacing:-.8px;margin-top:2px}

  /* ── Avatar block ── */
  .avatarblock{display:flex;flex-direction:column;align-items:center;margin:28px 0;padding:0 24px}
  .avatar{width:96px;height:96px;border-radius:48px;background:var(--brand);
    display:flex;align-items:center;justify-content:center;margin-bottom:16px;
    font-size:30px;font-weight:900;letter-spacing:-1px;color:#fff;
    box-shadow:0 12px 28px -6px rgba(245,136,48,.6)}
  .avatarblock .nombre{font-size:20px;font-weight:900;text-align:center}
  .avatarblock .email{font-size:13px;color:var(--muted);margin-top:3px}
  .leaderpill{display:inline-flex;align-items:center;gap:6px;margin-top:12px;
    padding:6px 14px;border-radius:999px;background:rgba(245,136,48,.14);
    border:1px solid rgba(245,136,48,.30);font-size:12px;font-weight:900;color:var(--brand)}
  .leaderpill .d{width:6px;height:6px;border-radius:3px;background:var(--brand)}

  /* ── Sections ── */
  .section{margin:20px 24px 0}
  .sectitle{font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

  /* Neu card (datos) */
  .neucard{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;
    box-shadow:0 8px 24px -12px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04)}
  .row{display:flex;align-items:center;justify-content:space-between;padding:16px}
  .rowleft{display:flex;align-items:center;gap:10px}
  .rowicon{width:32px;height:32px;border-radius:12px;background:rgba(245,136,48,.12);
    display:flex;align-items:center;justify-content:center;font-size:15px}
  .rowlabel{font-size:13px;font-weight:700;color:var(--muted)}
  .rowvalue{font-size:13px;font-weight:500;text-align:right}
  .divider{height:1px;background:var(--border);margin:0 16px}

  /* Apariencia (theme toggle) */
  .themerow{display:flex;gap:8px;padding:8px}
  .themeopt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:14px 6px;border-radius:12px;background:rgba(255,255,255,.04);
    font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted)}
  .themeopt .ti{font-size:20px}
  .themeopt.active{background:var(--brand);color:#fff;box-shadow:0 8px 18px -6px rgba(245,136,48,.6)}

  /* Logout button */
  .logout{margin:24px 24px 0;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:16px;border-radius:16px;background:rgba(239,68,68,.10);
    border:1px solid rgba(239,68,68,.30);font-size:15px;font-weight:900;color:var(--danger)}

  .footer{text-align:center;font-size:11px;color:var(--muted);margin-top:28px;opacity:.6}

  /* ── Tab bar ── */
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;z-index:40;
    background:#0F1A4D;border-top:1px solid rgba(255,255,255,.06);
    border-top-left-radius:28px;border-top-right-radius:28px;
    display:flex;padding:8px 8px 24px;box-shadow:0 -4px 12px rgba(0,0,0,.30)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .tab .ti{font-size:21px;line-height:1}
  .tab .tl{font-size:10px;letter-spacing:.4px;font-weight:700;color:var(--muted)}
  .tab.active .tl{color:var(--brand);font-weight:900}
  .tab .dot{width:4px;height:4px;border-radius:2px;background:var(--brand);margin-top:3px}
</style>
</head>
<body>

<!-- ════════ PERFIL ════════ -->
<div class="phone">
  <div class="aurora"></div>
  <div class="notch"></div>
  <div class="screen">
    <div class="statusbar"><span>9:41</span><span>📶 🔋 100%</span></div>

    <!-- Header -->
    <div class="pad shead">
      <div class="eyebrow">MI CUENTA</div>
      <div class="title">Perfil</div>
    </div>

    <!-- Avatar -->
    <div class="avatarblock">
      <div class="avatar">RA</div>
      <div class="nombre">Ronny Arellano</div>
      <div class="email">mecapacito.ecuador@gmail.com</div>
      <div class="leaderpill"><span class="d"></span> Líder</div>
    </div>

    <!-- Datos -->
    <div class="section">
      <div class="neucard">
        <div class="row">
          <div class="rowleft">
            <div class="rowicon">🪪</div>
            <div class="rowlabel">Cédula</div>
          </div>
          <div class="rowvalue">0923456789</div>
        </div>
        <div class="divider"></div>
        <div class="row">
          <div class="rowleft">
            <div class="rowicon">📞</div>
            <div class="rowlabel">Celular</div>
          </div>
          <div class="rowvalue">+593 99 123 4567</div>
        </div>
        <div class="divider"></div>
        <div class="row">
          <div class="rowleft">
            <div class="rowicon">🕓</div>
            <div class="rowlabel">Último ingreso</div>
          </div>
          <div class="rowvalue">14/05/26, 17:42</div>
        </div>
      </div>
    </div>

    <!-- Apariencia -->
    <div class="section">
      <div class="sectitle">Apariencia</div>
      <div class="neucard">
        <div class="themerow">
          <div class="themeopt"><div class="ti">📱</div>Sistema</div>
          <div class="themeopt"><div class="ti">☀️</div>Claro</div>
          <div class="themeopt active"><div class="ti">🌙</div>Oscuro</div>
        </div>
      </div>
    </div>

    <!-- Logout -->
    <div class="logout">⎋ Cerrar sesión</div>

    <div class="footer">certifai · v1.0</div>
    <div style="height:24px"></div>
  </div>

  <!-- Tab bar -->
  <div class="tabbar">
    <div class="tab"><div class="ti">🏠</div><div class="tl">Inicio</div></div>
    <div class="tab"><div class="ti">📅</div><div class="tl">Eventos</div></div>
    <div class="tab"><div class="ti">✅</div><div class="tl">Asistir</div></div>
    <div class="tab"><div class="ti">🎗️</div><div class="tl">Certs</div></div>
    <div class="tab active"><div class="ti">👤</div><div class="tl">Perfil</div><div class="dot"></div></div>
  </div>

  <div class="label">Perfil</div>
</div>

</body>
</html>
