<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CertifAI · Escanear QR</title>
<style>
  :root{
    --brand:#F58830; --brand-dark:#D97520;
    --bg:#0A1535; --text:#FFFFFF; --muted:#94A3B8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{
    background:#0a0f24;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex;flex-wrap:wrap;gap:48px;justify-content:center;
    padding:48px;color:var(--text);
  }
  .phone{
    width:390px;height:844px;border-radius:48px;
    background:#000;overflow:hidden;position:relative;
    box-shadow:0 40px 100px -20px rgba(0,0,0,.6),0 0 0 12px #05091a,0 0 0 13px rgba(255,255,255,.05);
  }
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:140px;height:30px;background:#000;border-radius:0 0 18px 18px;z-index:60}
  .statusbar{position:absolute;top:0;left:0;right:0;z-index:55;
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 28px 2px;font-size:13px;font-weight:700;color:#fff}
  .label{position:absolute;bottom:-34px;left:0;right:0;text-align:center;
    font-size:13px;font-weight:800;color:#64748B;letter-spacing:1px;text-transform:uppercase}

  /* Simulated camera viewport (dark, blurred indoor scene) */
  .camera{position:absolute;inset:0;
    background:
      radial-gradient(circle at 30% 25%,rgba(80,90,120,.35),transparent 40%),
      radial-gradient(circle at 75% 70%,rgba(60,70,100,.30),transparent 45%),
      linear-gradient(160deg,#1a1f33,#0d1020 60%,#070910);
    overflow:hidden}
  /* faint blurred shapes to evoke an out-of-focus room */
  .camera .blob{position:absolute;border-radius:50%;filter:blur(36px);opacity:.5}

  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.30)}

  /* Top controls */
  .backbtn{position:absolute;top:54px;left:20px;z-index:50;
    width:44px;height:44px;border-radius:50%;
    background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.20);
    display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}

  .caption{position:absolute;top:130px;left:50%;transform:translateX(-50%);z-index:50;
    padding:9px 18px;border-radius:999px;background:rgba(0,0,0,.50);
    font-size:14px;font-weight:700;letter-spacing:.3px;white-space:nowrap}

  /* Scan frame */
  .frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:260px;height:260px;z-index:50}
  .frame .corner{position:absolute;width:42px;height:42px;border-color:var(--brand);box-sizing:border-box}
  .frame .tl{top:0;left:0;border-top:4px solid var(--brand);border-left:4px solid var(--brand);border-top-left-radius:14px}
  .frame .tr{top:0;right:0;border-top:4px solid var(--brand);border-right:4px solid var(--brand);border-top-right-radius:14px}
  .frame .bl{bottom:0;left:0;border-bottom:4px solid var(--brand);border-left:4px solid var(--brand);border-bottom-left-radius:14px}
  .frame .br{bottom:0;right:0;border-bottom:4px solid var(--brand);border-right:4px solid var(--brand);border-bottom-right-radius:14px}
  /* glow + scan line */
  .frame .inner{position:absolute;inset:10px;border-radius:18px;
    box-shadow:0 0 60px 6px rgba(245,136,48,.45),inset 0 0 40px rgba(245,136,48,.10);
    border:1px solid rgba(245,136,48,.25)}
  .scanline{position:absolute;left:14px;right:14px;top:46%;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--brand),transparent);
    box-shadow:0 0 12px 2px rgba(245,136,48,.7)}
  /* faux QR centered to suggest detection */
  .qr{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:150px;height:150px;opacity:.85;
    background-image:
      linear-gradient(#fff 0 0),linear-gradient(#fff 0 0);
    background:#fff;border-radius:10px;padding:14px;z-index:49;
    display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:3px}
  .qr i{background:#0A1535;border-radius:2px}
  .qr i.b{background:transparent}

  /* Hint */
  .hint{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);z-index:50;
    display:inline-flex;align-items:center;gap:9px;padding:11px 18px;border-radius:999px;
    background:rgba(0,0,0,.50);border:1px solid rgba(255,255,255,.10);
    font-size:13px;font-weight:500;color:rgba(255,255,255,.92);white-space:nowrap}
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span>📶 🔋 100%</span></div>

  <div class="camera">
    <div class="blob" style="width:180px;height:180px;background:#5b6488;top:60px;left:-40px"></div>
    <div class="blob" style="width:220px;height:220px;background:#3a4566;bottom:90px;right:-60px"></div>
    <div class="blob" style="width:140px;height:140px;background:#6d5a78;top:300px;left:120px;opacity:.35"></div>
  </div>
  <div class="scrim"></div>

  <div class="backbtn">✕</div>

  <div class="caption">Escaneá el QR del evento</div>

  <!-- Faux QR being detected -->
  <div class="qr">
    <i></i><i></i><i></i><i class="b"></i><i></i><i></i><i></i>
    <i></i><i class="b"></i><i></i><i></i><i class="b"></i><i class="b"></i><i></i>
    <i></i><i></i><i class="b"></i><i></i><i></i><i></i><i class="b"></i>
    <i class="b"></i><i></i><i></i><i class="b"></i><i></i><i class="b"></i><i></i>
    <i></i><i class="b"></i><i></i><i></i><i class="b"></i><i></i><i></i>
    <i></i><i class="b"></i><i class="b"></i><i></i><i></i><i class="b"></i><i></i>
    <i></i><i></i><i></i><i class="b"></i><i></i><i></i><i></i>
  </div>

  <div class="frame">
    <div class="inner"></div>
    <div class="scanline"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>

  <div class="hint">⊡ Sostené el celular firme dentro del marco</div>

  <div class="label">Escáner QR</div>
</div>

</body>
</html>
