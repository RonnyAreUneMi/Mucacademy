{% extends 'panel/base.html' %}
{% load static %}

{% block content %}
<div class="max-w-[1600px] mx-auto space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
            <h1 class="text-2xl font-black text-gray-800 dark:text-white tracking-tight flex items-center gap-3">
                <i class="fa-solid fa-diagram-project text-[#F58830]"></i> Modelado de datos
            </h1>
            <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Diagrama entidad-relación interactivo del sistema.</p>
        </div>
        <a href="{% static 'erd-viewer.html' %}" target="_blank" rel="noopener"
           class="px-4 py-2.5 rounded-xl bg-[#F58830] hover:bg-[#D97520] text-white font-bold text-sm transition-all flex items-center gap-2 whitespace-nowrap">
            <i class="fa-solid fa-up-right-from-square"></i> Abrir en pestaña
        </a>
    </div>
    <div class="lg-card rounded-2xl overflow-hidden">
        <iframe src="{% static 'erd-viewer.html' %}" class="w-full" style="height: 82vh; border: 0;" title="Modelo de datos"></iframe>
    </div>
</div>
{% endblock %}
