{% comment %}
Select2 para el campo "Título" de los ponentes (catálogo de títulos académicos).
Incluye CDN (jQuery + Select2), estilos del tema CertifAI (claro/oscuro) y el
helper global `initTitleSelect(el)` para inicializarlo sobre un <select>.
{% endcomment %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<style>
    /* ── Select2 · tema CertifAI (estilo Apple) ─────────────── */
    .select2-container { width: 100% !important; }

    /* Caja seleccionada — iguala a los inputs (p-3 rounded-xl) */
    .select2-container--default .select2-selection--single {
        height: 46px;
        border-radius: 0.75rem;
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        display: flex;
        align-items: center;
        padding: 0 0.85rem;
        transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .select2-container--default .select2-selection--single:hover { border-color: #d1d5db; }
    .select2-container--default .select2-selection--single .select2-selection__rendered {
        color: #1f2937;
        line-height: normal;
        padding: 0;
        font-size: 0.9rem;
        font-weight: 600;
    }
    .select2-container--default .select2-selection--single .select2-selection__placeholder { color: #9ca3af; font-weight: 500; }
    /* Flecha chevron propia */
    .select2-container--default .select2-selection--single .select2-selection__arrow { height: 44px; width: 28px; right: 4px; }
    .select2-container--default .select2-selection--single .select2-selection__arrow b { display: none; }
    .select2-container--default .select2-selection--single .select2-selection__arrow::after {
        content: ''; position: absolute; top: 50%; right: 10px; width: 8px; height: 8px;
        border-right: 2px solid #9ca3af; border-bottom: 2px solid #9ca3af;
        transform: translateY(-65%) rotate(45deg); transition: transform .2s;
    }
    .select2-container--default.select2-container--open .select2-selection__arrow::after { transform: translateY(-35%) rotate(-135deg); }
    /* Botón limpiar (x) */
    .select2-container--default .select2-selection__clear {
        color: #9ca3af; font-weight: 700; margin-right: 8px; font-size: 16px; cursor: pointer;
    }
    .select2-container--default .select2-selection__clear:hover { color: #ef4444; }
    /* Foco / abierto */
    .select2-container--default.select2-container--focus .select2-selection--single,
    .select2-container--default.select2-container--open  .select2-selection--single {
        border-color: #F58830;
        box-shadow: 0 0 0 3px rgba(245,136,48,0.18);
        background: #fff;
    }

    /* Dropdown */
    .select2-dropdown {
        border-radius: 0.9rem;
        border: 1px solid #e5e7eb;
        overflow: hidden;
        box-shadow: 0 16px 40px rgba(0,0,0,.16);
        background: #ffffff;
    }
    .select2-container--open .select2-dropdown { animation: s2pop .16s cubic-bezier(.2,.9,.3,1.1); }
    @keyframes s2pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
    .select2-results { padding: 6px; }
    .select2-container--default .select2-results__option {
        font-size: 0.9rem; color: #374151; font-weight: 500;
        border-radius: 0.6rem; padding: 0.55rem 0.7rem; margin: 2px 0;
        transition: background .12s, color .12s;
    }
    .select2-container--default .select2-results__option--highlighted[aria-selected] { background: rgba(245,136,48,0.14); color: #b45309; }
    .select2-container--default .select2-results__option[aria-selected="true"] {
        background: #F58830; color: #fff; font-weight: 700; position: relative; padding-right: 2rem;
    }
    .select2-container--default .select2-results__option[aria-selected="true"]::after {
        content: ''; position: absolute; right: 0.8rem; top: 50%; width: 6px; height: 11px;
        border-right: 2px solid #fff; border-bottom: 2px solid #fff; transform: translateY(-65%) rotate(45deg);
    }
    .select2-container--default .select2-search--dropdown { padding: 6px 6px 2px; }
    .select2-container--default .select2-search--dropdown .select2-search__field {
        border-radius: 0.6rem; border: 1px solid #e5e7eb; padding: 0.55rem 0.7rem; outline: none;
        font-size: 0.9rem; transition: border-color .2s, box-shadow .2s;
    }
    .select2-container--default .select2-search--dropdown .select2-search__field:focus {
        border-color: #F58830; box-shadow: 0 0 0 3px rgba(245,136,48,0.15);
    }

    /* ── Dark mode ─────────────────────────────────────────── */
    .dark .select2-container--default .select2-selection--single { background: rgba(15,22,58,0.6); border-color: rgba(255,255,255,0.1); }
    .dark .select2-container--default .select2-selection--single:hover { border-color: rgba(255,255,255,0.2); }
    .dark .select2-container--default.select2-container--open .select2-selection--single,
    .dark .select2-container--default.select2-container--focus .select2-selection--single { background: #0F163A; }
    .dark .select2-container--default .select2-selection--single .select2-selection__rendered { color: #fff; }
    .dark .select2-container--default .select2-selection--single .select2-selection__placeholder { color: #94a3b8; }
    .dark .select2-container--default .select2-selection--single .select2-selection__arrow::after { border-color: #94a3b8; }
    .dark .select2-dropdown { background: #152448; border-color: rgba(255,255,255,0.1); box-shadow: 0 16px 40px rgba(0,0,0,.5); }
    .dark .select2-container--default .select2-results__option { color: #e2e8f0; background: transparent; }
    .dark .select2-container--default .select2-results__option--highlighted[aria-selected] { background: rgba(245,136,48,0.20); color: #fdba74; }
    .dark .select2-container--default .select2-results__option[aria-selected="true"] { background: #F58830; color: #fff; }
    .dark .select2-container--default .select2-search--dropdown .select2-search__field { background: #0F163A; color: #fff; border-color: rgba(255,255,255,0.1); }
</style>

<script>
    function initTitleSelect(el) {
        if (!(window.jQuery && jQuery.fn.select2) || !el) return;
        // Evita doble init si el nodo ya fue convertido.
        if (jQuery(el).hasClass('select2-hidden-accessible')) return;
        jQuery(el).select2({
            width: '100%',
            placeholder: 'Título…',
            allowClear: true,
        });
    }
</script>
