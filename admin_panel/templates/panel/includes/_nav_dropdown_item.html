{% comment %}Un ítem del dropdown del nav. Args: item {url,color,icon,label,badge}, pendientes_count.{% endcomment %}
<a href="{{ item.url }}"
   class="nav-item nav-item--{{ item.color|default:'brand' }}
          flex items-center gap-3 px-3 py-2.5 mx-1.5 my-0.5 rounded-xl
          text-sm transition-all group/item">
    <span class="nav-disc">
        {% if item.svg %}<span class="nav-disc-icon flex items-center justify-center">{{ item.svg }}</span>{% else %}<i class="fa-solid {{ item.icon }} nav-disc-icon"></i>{% endif %}
    </span>
    <span class="flex-1 font-semibold text-slate-700 group-hover/item:text-slate-900
                 dark:text-slate-300 dark:group-hover/item:text-white transition-colors">{{ item.label }}</span>
    {% if item.badge == 'pendientes_count' and pendientes_count > 0 %}
    <span class="qp-badge !static !top-auto !right-auto">{{ pendientes_count }}</span>
    {% endif %}
</a>
